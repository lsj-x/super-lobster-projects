version: '3.8'

services:
  # 后端服务 (例如 Node.js/Python/Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # 前端服务 (例如 Nginx 托管 React/Vue)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # 数据库服务 (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: app-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  # 缓存服务 (Redis)
  redis:
    image: redis:7-alpine
    container_name: app-redis
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

# 定义自定义网络，实现容器间互通
networks:
  app-network:
    driver: bridge

# 定义持久化卷
volumes:
  db_data:
  redis_data:
